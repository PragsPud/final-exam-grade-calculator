<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Exam Grade Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Final Exam Grade Calculator</h1>
        
        <div class="input-group">
            <label for="currentGrade">Current Grade (%)</label>
            <input type="number" id="currentGrade" placeholder="Enter your current grade" step="0.01">
        </div>
        
        <div class="input-group">
            <label for="desiredGrade">Desired Grade (%)</label>
            <input type="number" id="desiredGrade" placeholder="Enter your desired grade" step="0.01">
        </div>
        
        <div class="input-group">
            <label for="examWeight">Final Exam Weight (%)</label>
            <input type="number" id="examWeight" placeholder="Enter final exam weight" step="0.01">
        </div>
        
        <button id="calculateBtn">Calculate</button>
        
        <div id="error" class="error"></div>
        
        <div id="result" class="result">
            <h2>Result</h2>
            <p id="resultText"></p>
            <p id="warningText" class="warning"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
